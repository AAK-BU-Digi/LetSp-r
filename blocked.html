<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siden er blokeret</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px 0;
            box-sizing: border-box;
        }

        .container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 15px;
            color: #ef4444;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .reason-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 25px;
            word-break: break-word;
            text-align: left;
        }

        .reason-box strong {
            color: #f8fafc;
            display: block;
            margin-bottom: 4px;
        }

        .debug-panel {
            text-align: left;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .debug-panel[hidden] { display: none; }

        .debug-panel ul {
            margin: 6px 0 12px;
            padding-left: 18px;
        }

        .debug-score {
            font-size: 15px;
            color: #f8fafc;
            margin: 0 0 4px;
        }

        .debug-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .debug-actions a,
        .debug-actions button {
            flex: 1;
            min-width: 140px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: transparent;
            color: #f8fafc;
            font: inherit;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .debug-actions .primary {
            background: #38bdf8;
            border-color: #38bdf8;
            color: #0f172a;
        }

        .debug-actions a[hidden],
        .debug-panel textarea[hidden] { display: none; }

        .debug-panel textarea {
            width: 100%;
            height: 120px;
            margin-top: 8px;
            box-sizing: border-box;
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            line-height: 1.4;
        }

        .debug-note {
            margin: 8px 0 0;
            font-size: 12px;
            color: #64748b;
        }

        .divider {
            height: 1px;
            background-color: #334155;
            margin-bottom: 20px;
        }

        .footer {
            font-size: 12px;
            color: #64748b;
        }

        .footer span {
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛑</div>
        <h1>Hov! Siden er blokeret</h1>
        <p>Denne hjemmeside er spærret af skolens it-system for at sikre, at der er arbejdsro i timerne, så du kan fokusere på undervisningen.</p>
        
        <div id="reasonContainer" class="reason-box" style="display: none;">
            <strong>Årsag til blokering:</strong>
            <span id="reasonText">---</span>
        </div>

        <div id="debugPanel" class="debug-panel" hidden>
            <p class="debug-score" id="debugScore"></p>
            <ul id="debugSignals"></ul>
            <div class="debug-actions">
                <a id="debugSend" class="primary" target="_blank" rel="noopener" hidden>Send fejlmelding</a>
                <button id="debugCopy" type="button">Kopiér tekst</button>
            </div>
            <textarea id="debugText" readonly hidden></textarea>
            <p class="debug-note" id="debugNote"></p>
        </div>

        <div class="divider"></div>
        
        <div class="footer">
            LetSpær - baseret på <span>NetShield</span>
        </div>
    </div>

    <script src="debug.js"></script>
    <script src="report.js"></script>
    <script src="blocked.js"></script>
</body>
</html>
